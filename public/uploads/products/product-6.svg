<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent-grad-6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <filter id="glow-6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="450" fill="url(#bg-grad-6)" rx="16" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="90" x2="600" y2="90" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="270" x2="600" y2="270" />
    <line x1="0" y1="360" x2="600" y2="360" />
    <line x1="120" y1="0" x2="120" y2="450" />
    <line x1="240" y1="0" x2="240" y2="450" />
    <line x1="360" y1="0" x2="360" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
  </g>

  <!-- Glowing Aura -->
  <circle cx="300" cy="200" r="110" fill="#ec4899" opacity="0.25" filter="url(#glow-6)" />

  <!-- Center Icon Graphic -->
  <g transform="translate(230, 130)">
    <rect width="140" height="140" rx="28" fill="url(#accent-grad-6)" opacity="0.9" filter="url(#glow-6)" />
    <circle cx="70" cy="70" r="45" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.8" />
    <path d="M 50 70 L 65 85 L 92 55" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Category Pill Badge -->
  <g transform="translate(40, 40)">
    <rect width="130" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="20" cy="16" r="5" fill="#ec4899" />
    <text x="34" y="21" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Audio</text>
  </g>

  <!-- Product ID Badge -->
  <g transform="translate(500, 40)">
    <rect width="60" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="30" y="21" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">#6</text>
  </g>

  <!-- Product Name & Showcase Label -->
  <text x="300" y="340" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Spatial Earbuds</text>
  <text x="300" y="375" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" text-anchor="middle">Premium Official Hardware | In Stock</text>
</svg>